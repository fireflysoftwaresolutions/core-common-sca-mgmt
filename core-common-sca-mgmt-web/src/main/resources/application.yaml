spring:
  application:
    name: core-common-sca-mgmt
    version: 1.0.0
    description: Strong Customer Authentication Management Application
    team:
      name: Firefly Software Foundation
      email: dev@fireflysoftware.io

  r2dbc:
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

  address: ${SERVER_ADDRESS:localhost}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: method
    docExpansion: none
    filter: true
  packages-to-scan: io.fireflysoftware.core.sca.web.controllers
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

firefly:
  security:
    resource-server:
      enabled: false
  sca:
    recovery:
      enabled: ${SCA_RECOVERY_ENABLED:false}

logging:
  level:
    root: INFO
    io.fireflysoftware: INFO
    org.springframework.web: INFO
    org.springframework.r2dbc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
    io.fireflysoftware: INFO
    org.springframework.r2dbc: INFO
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      on-profile: testing

logging:
  level:
    root: INFO
    io.fireflysoftware: INFO
    org.springframework.r2dbc: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    io.fireflysoftware: INFO
    org.springframework: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


---
spring:
  config:
    activate:
      on-profile: sca-recovery-receiver

# This profile does not supply qualified native/owner/factor/executor capabilities.
# Enabling without them fails closed in the independent core recovery configuration.
firefly:
  security:
    resource-server:
      enabled: ${SCA_RECOVERY_ENABLED:false}
      issuer: ${SCA_RECOVERY_TRUSTED_ISSUER}
      jwk-set-uri: ${SCA_RECOVERY_TRUSTED_JWKS_URI}
      audiences:
        - ${SCA_RECOVERY_AUDIENCE}
      tenant-claim-paths: [tenant_id]
      tenant-required: true
      strict-policy: true
      signature-algorithms: [RS256]
  sca:
    recovery:
      receiver:
        issuer: ${SCA_RECOVERY_TRUSTED_ISSUER}
        audience: ${SCA_RECOVERY_AUDIENCE}
        allowed-clients: ${SCA_RECOVERY_ALLOWED_CLIENTS}
        allowed-populations: ${SCA_RECOVERY_ALLOWED_POPULATIONS}
